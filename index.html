<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letters to Fictional Worlds</title>
    <p id="selected-character"></p>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f9f9f9;
      }

      /* Container layout using Flexbox */
      .container {
        display: flex;
        flex-wrap: wrap; /* Allows cards to wrap on smaller screens */
        gap: 20px;       /* Creates space between each card */
        margin-top: 20px;
      }

      button.box {
        flex: 1;
        min-width: 220px; /* Ensures cards don't shrink too small */
        background-color: #f0f4f8;
        border: 2px solid #0c0609;
        border-radius: 8px; 
        padding: 20px;   
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        cursor: pointer;
  
        /* Reset button defaults & fix layout */
        font-family: inherit; /* Inherits the page font */
        font-size: inherit;   /* Inherits paragraph font size */
        color: inherit;       /* Keeps text color consistent */
        text-align: left;     /* Aligns text back to the left */

        /* Smooth transition for hover effects */
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      /* Hover effects */
      button.box:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.18);
        border-color: #4a5568;
      }

      .box h4 {
        margin-top: 0;
        color: #1a202c;
      }
    </style>
</head>
<body>
    <h1>Choose your companion!</h1>
    <p>Dear user, you can choose to write to from these characters below 💕</p>

    <div class="container">
      <button class="box" id="luke">
        <h4>Luke Skywalker</h4>
        <p>He represents the classic hero's journey and is a role model to millions of people across the world.</p>
      </button>

      <button class="box" id="howl">
        <h4>Howl</h4>
        <p>A powerful, vain, and flamboyant wizard who hides his kind heart behind a mask of cowardice and vanity.</p>
      </button>
      
      <button class="box" id="cinderella">
        <h4>Cinderella</h4>
        <p>Cinderella knows that being a positive influence is a sort of magic that can transform the world, so she is warm and sincere with everyone she meets.</p>
      </button>
    </div>

        const howlButton = document.getElementById('howl');
        howlButton.addEventListener('click',function(){
            
        });
        const selectedCharacter = document.getElementById('selected-character');
    </script>
</body>
</html>
